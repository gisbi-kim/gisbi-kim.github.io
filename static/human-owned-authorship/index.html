<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AI 시대의 저자성을 문장 생산이 아니라 판단, 책임, 반복과 삶의 서명으로 다시 묻는 에세이.">
  <title>한쪽은 문장이고, 다른 쪽은 서명이다</title>
  <style>
    :root{--paper:#f2eee5;--sheet:#fbf8f1;--ink:#171713;--muted:#6b675e;--red:#8d261f;--rule:#cbc3b4;--serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;--sans:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);letter-spacing:-.018em}.progress{position:fixed;inset:0 auto auto 0;width:0;height:3px;background:var(--red);z-index:20}.masthead{min-height:92vh;display:grid;align-items:end;border-bottom:1px solid var(--ink);position:relative;overflow:hidden}.masthead:before{content:"OWNED";position:absolute;right:-.055em;top:-.12em;color:#e4ded1;font:900 clamp(7rem,24vw,20rem)/1 var(--sans);letter-spacing:-.09em;z-index:-1}.masthead__inner,.page{width:min(1180px,calc(100% - 48px));margin:auto}.masthead__inner{padding:88px 0 68px;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.34fr);gap:72px;align-items:end}.eyebrow{margin:0 0 30px;color:var(--red);font:800 12px/1.2 var(--sans);letter-spacing:.19em;text-transform:uppercase}.masthead h1{max-width:800px;margin:0;font-size:clamp(3.2rem,7.7vw,7.4rem);line-height:1.02;letter-spacing:-.075em;word-break:keep-all}.masthead h1 strong{color:var(--red);font-weight:inherit}.subtitle{max-width:710px;margin:32px 0 0;font-size:clamp(1.2rem,2.3vw,1.7rem);line-height:1.55;word-break:keep-all}.folio{border-top:1px solid var(--ink);padding-top:13px;font:12px/1.75 var(--sans);color:var(--muted)}.folio strong{display:block;color:var(--ink);font-size:13px;letter-spacing:.08em}.signature-line{margin-top:52px;display:flex;align-items:center;gap:14px;color:var(--red);font:italic 1rem/1 var(--serif)}.signature-line:after{content:"";height:1px;background:var(--red);width:min(220px,35vw)}.page{display:grid;grid-template-columns:210px minmax(0,720px);gap:clamp(42px,8vw,110px);justify-content:center;padding:90px 0 140px}.rail{align-self:start;position:sticky;top:34px;font:12px/1.7 var(--sans);color:var(--muted)}.rail__label{color:var(--red);font-weight:800;letter-spacing:.15em;text-transform:uppercase}.rail nav{margin-top:18px;padding-left:15px;border-left:1px solid var(--rule)}.rail a{display:block;margin:0 0 10px;color:inherit;text-decoration:none}.rail a:hover,.rail a[aria-current=true]{color:var(--red)}.article{min-width:0;font-size:clamp(17px,1.7vw,19px);line-height:2}.article>p{margin:0 0 1.6em}.article h2{margin:5.2rem 0 1.7rem;padding-top:1.4rem;border-top:1px solid var(--ink);font-size:clamp(1.9rem,4vw,3.15rem);line-height:1.25;letter-spacing:-.055em;word-break:keep-all}.article h2:before{content:attr(data-index);display:block;margin-bottom:12px;color:var(--red);font:800 11px/1 var(--sans);letter-spacing:.16em}.article h3{margin:3.2rem 0 1rem;font-size:1.35rem;line-height:1.45}.article strong{color:var(--red);font-weight:800}.article blockquote{position:relative;margin:2.8rem 0;padding:1.9rem 2rem;border:1px solid var(--ink);background:var(--sheet);font-size:clamp(1.18rem,2.2vw,1.45rem);line-height:1.65;letter-spacing:-.03em}.article blockquote:before{content:"SIGNATURE";position:absolute;top:-8px;left:18px;padding:0 8px;background:var(--sheet);color:var(--red);font:800 10px/1 var(--sans);letter-spacing:.14em}.article blockquote p{margin:0}.article hr{width:62px;margin:4rem 0;border:0;border-top:5px solid var(--red)}.article ul,.article ol{padding-left:1.25em;margin:0 0 1.7em}.article li{padding-left:.35em;margin:.45em 0}.closing{margin-top:100px;padding-top:30px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:30px;color:var(--muted);font:12px/1.7 var(--sans)}.closing__mark{color:var(--red);font:bold italic 1.35rem/1 var(--serif)}.load-error{padding:24px;border:1px solid var(--red);color:var(--red);font-family:var(--sans)}@media(max-width:820px){.masthead{min-height:auto}.masthead__inner{grid-template-columns:1fr;gap:48px;padding-top:110px}.page{grid-template-columns:1fr;width:min(720px,calc(100% - 34px));padding-top:58px}.rail{display:none}}@media(max-width:520px){.masthead__inner{width:calc(100% - 32px);padding-bottom:48px}.masthead h1{font-size:clamp(2.75rem,15vw,4.4rem)}.page{width:calc(100% - 28px)}.article blockquote{padding:1.5rem 1.2rem}.closing{display:block}.closing__mark{margin-top:20px}}
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <header class="masthead">
    <div class="masthead__inner">
      <div>
        <p class="eyebrow">Essay on AI · Authorship · Responsibility</p>
        <h1>한쪽은 문장이고,<br>다른 쪽은 <strong>서명</strong>이다</h1>
        <p class="subtitle">AI 시대의 저자성은 <strong>human-made</strong>보다 <strong>human-owned</strong>로</p>
        <div class="signature-line">Giseop Kim</div>
      </div>
      <div class="folio"><strong>OWNERSHIP RECORD</strong>판단을 통과한 문장<br>책임이 닿는 범위<br>2026. 08. 15.</div>
    </div>
  </header>
  <div class="page">
    <aside class="rail"><span class="rail__label">Contents</span><nav id="contents" aria-label="글 목차"></nav></aside>
    <main>
      <article class="article" id="article" aria-live="polite"></article>
      <footer class="closing"><span>© Giseop Kim · Essays<br>Human-made에서 human-owned로.</span><span class="closing__mark">signed in time</span></footer>
    </main>
  </div>
  <script>
    const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const inline=s=>escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    function renderMarkdown(source){
      const lines=source.replace(/\r\n/g,'\n').split('\n');
      let mastheadLines=0;
      while(lines.length&&mastheadLines<3){if(!lines[0].trim()){lines.shift();continue}if(/^#{1,3}\s/.test(lines[0])){lines.shift();mastheadLines++;continue}break}
      while(lines.length&&!lines[0].trim()) lines.shift();
      const out=[]; let paragraph=[]; let list=null; let quote=[]; let section=0;
      const flush=()=>{if(paragraph.length){out.push('<p>'+paragraph.map(inline).join('<br>')+'</p>');paragraph=[]}if(quote.length){out.push('<blockquote><p>'+quote.map(x=>inline(x.replace(/^>\s?/,''))).join('<br>')+'</p></blockquote>');quote=[]}if(list){out.push('</'+list+'>');list=null}};
      for(const line of lines){
        if(!line.trim()){flush();continue}
        if(/^---\s*$/.test(line)){flush();out.push('<hr>');continue}
        const heading=line.match(/^(#{2,3})\s+(.+)$/);
        if(heading){flush();if(heading[1].length===2){section++;out.push(`<h2 id="section-${section}" data-index="SECTION ${String(section).padStart(2,'0')}">${inline(heading[2])}</h2>`)}else out.push('<h3>'+inline(heading[2])+'</h3>');continue}
        if(/^>\s?/.test(line)){if(paragraph.length||list)flush();quote.push(line);continue}
        const bullet=line.match(/^[-*]\s+(.+)$/), numbered=line.match(/^\d+[.)]\s+(.+)$/);
        if(bullet||numbered){if(paragraph.length||quote.length)flush();const type=bullet?'ul':'ol';if(list!==type){if(list)out.push('</'+list+'>');out.push('<'+type+'>');list=type}out.push('<li>'+inline((bullet||numbered)[1])+'</li>');continue}
        if(list)flush();paragraph.push(line);
      }
      flush(); return out.join('');
    }
    fetch('./article.md').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(source=>{
      const article=document.getElementById('article');article.innerHTML=renderMarkdown(source);
      document.querySelectorAll('.article h2').forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;document.getElementById('contents').appendChild(a)});
      const links=[...document.querySelectorAll('#contents a')];const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.removeAttribute('aria-current'));const a=links.find(x=>x.hash==='#'+e.target.id);if(a)a.setAttribute('aria-current','true')}}),{rootMargin:'-15% 0px -72%'});document.querySelectorAll('.article h2').forEach(h=>observer.observe(h));
    }).catch(()=>document.getElementById('article').innerHTML='<p class="load-error">글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>');
    addEventListener('scroll',()=>{const d=document.documentElement;document.querySelector('.progress').style.width=(100*d.scrollTop/(d.scrollHeight-d.clientHeight))+'%'},{passive:true});
  </script>
</body>
</html>
