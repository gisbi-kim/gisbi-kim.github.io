name: One-time Pages redeploy trigger

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/trigger-pages-redeploy-urobotics.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time trigger workflow
        run: rm .github/workflows/trigger-pages-redeploy-urobotics.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trigger-pages-redeploy-urobotics.yml
          git commit -m 'Remove one-time Pages redeploy trigger'
          git push
