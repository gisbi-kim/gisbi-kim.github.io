name: One-time URobotics label fixer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-urobotics-label.yml'

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Korean URobotics labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('static/data/profile-sections.json')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"Host / Venue": "URobotics 초청"', '"Host / Venue": "URobotics"')
          text = text.replace('"Invitation From": "URobotics 초청"', '"Invitation From": "URobotics"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-urobotics-label.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/data/profile-sections.json .github/workflows/fix-urobotics-label.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update URobotics talk metadata'
            git push
          fi
